[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datahub-qualytics"
version = "0.1.0"
description = "Qualytics metadata ingestion source for DataHub"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Qualytics", email = "support@qualytics.ai" }]
keywords = ["datahub", "qualytics", "metadata", "data-quality", "ingestion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]

# Kept deliberately thin. Upstream declares these in metadata-ingestion/setup.py's
# `plugins` dict instead, so anything added here has to be mirrored there at port time.
dependencies = [
  # 1.7 is where the framework adds stale-entity removal and the other workunit
  # processors itself; the source relies on that rather than wiring its own.
  "acryl-datahub>=1.7.0",
  "pydantic>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pyyaml>=6.0",
  "pytest-cov>=5.0",
  "deepdiff>=6.0",
  "requests-mock>=1.12",
  "ruff>=0.6",
  "types-requests",
]

[project.urls]
Homepage = "https://www.qualytics.io"
Repository = "https://github.com/qualytics/datahub-qualytics-source"
Issues = "https://github.com/qualytics/datahub-qualytics-source/issues"

# Out-of-tree plugin registration. DataHub discovers sources through this entry-point
# group, so `type: qualytics` in a recipe works from a plain `pip install` with no
# monorepo changes. Upstream, the same line lands in setup.py's entry_points.
[project.entry-points."datahub.ingestion.source.plugins"]
qualytics = "datahub_qualytics.source:QualyticsSource"

[tool.hatch.build.targets.wheel]
packages = ["src/datahub_qualytics"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "datahub.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
